<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexo Tech Smart - Tienda de Tecnología</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="top-header">
        <div class="header-inner">
            <div class="h-left">
                <div class="logo">Nexo Tech Smart</div>
            </div>
            <div class="h-center">
                <div class="search-wrap">
                    <input type="text" id="searchInput" placeholder="Buscar productos..." class="search-input">
                    <button class="search-btn">&#128269;</button>
                </div>
            </div>
            <div class="h-right">
                <label class="mode-toggle" title="Cambiar modo">
                    <span class="mode-label" id="modeLabel">Cliente</span>
                    <input type="checkbox" id="modeSwitch">
                    <span class="mode-slider"></span>
                </label>
                <button id="cartBtn" class="cart-btn">
                    <span class="cart-icon">&#128722;</span>
                    <span class="cart-badge" id="cartCount">0</span>
                </button>
            </div>
        </div>
    </header>

    <nav class="cat-nav">
        <div class="cat-nav-inner">
            <div id="categoryFilters" class="cat-filters"></div>
        </div>
    </nav>

    <section class="hero">
        <div class="hero-slide">
            <div class="hero-text">
                <h2>Nexo Tech Smart</h2>
                <p>Soluciones inteligentes para tu hogar</p>
                <a href="#productos" class="btn-hero">Ver productos</a>
            </div>
        </div>
    </section>

    <section id="productos" class="section">
        <div class="container">
            <div id="productGrid" class="product-grid"></div>
        </div>
    </section>

    <aside id="cartSidebar" class="cart-sidebar">
        <div class="cart-header">
            <h2>Carrito</h2>
            <button id="closeCart" class="cart-close">&times;</button>
        </div>
        <div id="cartItems" class="cart-items"></div>
        <div class="cart-footer">
            <p>Total: <span id="cartTotal">&#8353;0.00</span></p>
            <button id="checkoutBtn" class="btn-cart">Finalizar compra</button>
        </div>
    </aside>
    <div id="cartOverlay" class="cart-overlay"></div>

    <div id="productModal" class="modal">
        <div class="modal-overlay" id="modalOverlay"></div>
        <div class="modal-content">
            <button class="modal-close" id="modalClose">&times;</button>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <footer class="site-footer">
        <div class="footer-inner">
            <div class="footer-col">
                <h4>Nexo Tech Smart</h4>
                <p>Tecnología e innovación para tu hogar y negocio.</p>
            </div>
            <div class="footer-col">
                <h4>Enlaces</h4>
                <a href="#inicio">Inicio</a>
                <a href="#productos">Productos</a>
            </div>
            <div class="footer-col">
                <h4>Contacto</h4>
                <p>San José, Costa Rica</p>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2026 Nexo Tech Smart. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
