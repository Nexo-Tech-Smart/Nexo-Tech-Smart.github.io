<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexo Tech Smart - Tienda de Tecnología</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <nav>
        <div class="nav-container">
            <div class="logo">Nexo Tech Smart</div>
            <ul class="nav-links">
                <li><a href="#inicio">Inicio</a></li>
                <li><a href="#productos">Productos</a></li>
            </ul>
            <div class="nav-right">
                <label class="mode-toggle" title="Cambiar modo">
                    <span class="mode-label" id="modeLabel">Cliente</span>
                    <input type="checkbox" id="modeSwitch">
                    <span class="mode-slider"></span>
                </label>
                <button id="cartBtn" class="cart-btn">
                    &#128722; <span id="cartCount">0</span>
                </button>
            </div>
        </div>
    </nav>

    <section id="inicio" class="hero">
        <div class="hero-content">
            <h1>Nexo Tech Smart</h1>
            <p>Soluciones inteligentes para tu hogar</p>
            <a href="#productos" class="btn">Ver productos</a>
        </div>
    </section>

    <section id="productos" class="section">
        <div class="container">
            <h2>Productos</h2>
            <input type="text" id="searchInput" placeholder="Buscar productos..." class="search-input">
            <div id="categoryFilters" class="cat-filters"></div>
            <div id="productGrid" class="product-grid"></div>
        </div>
    </section>

    <aside id="cartSidebar" class="cart-sidebar">
        <div class="cart-header">
            <h2>Carrito</h2>
            <button id="closeCart">&times;</button>
        </div>
        <div id="cartItems" class="cart-items"></div>
        <div class="cart-footer">
            <p>Total: <span id="cartTotal">&#8353;0.00</span></p>
            <button id="checkoutBtn" class="btn">Finalizar compra</button>
        </div>
    </aside>
    <div id="cartOverlay" class="cart-overlay"></div>

    <div id="productModal" class="modal">
        <div class="modal-overlay" id="modalOverlay"></div>
        <div class="modal-content">
            <button class="modal-close" id="modalClose">&times;</button>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>



    <footer>
        <p>&copy; 2026 Nexo Tech Smart. Todos los derechos reservados.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
